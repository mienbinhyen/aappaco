<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paco - Miền Bình Yên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:italic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .font-serif-accent { font-family: 'Playfair Display', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .peaceful-gradient { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
    </style>
</head>
<body class="bg-[#f9fafb] min-h-screen flex flex-col font-sans text-slate-900">

    <header class="bg-white border-b border-slate-100 sticky top-0 z-[60] px-8 py-5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white shadow-xl rotate-3">
                    <span class="text-2xl font-bold uppercase">P</span>
                </div>
                <div>
                    <h1 class="text-3xl font-black tracking-tight uppercase leading-none">Paco</h1>
                    <p class="font-serif-accent text-sky-600 text-lg tracking-wide">Miền Bình Yên</p>
                </div>
            </div>
            <button id="openAiBtn" class="flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white rounded-2xl text-sm font-bold shadow-lg hover:bg-indigo-700 transition-all active:scale-95">
                <i data-lucide="sparkles" class="w-4 h-4"></i> Soạn thảo với Gemini
            </button>
        </div>
    </header>

    <!-- AI Assistant Modal -->
    <div id="aiModal" class="fixed inset-0 z-[100] hidden flex justify-center items-center bg-slate-900/40 backdrop-blur-md p-4">
        <div class="w-full max-w-5xl bg-white h-[85vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden">
            <div class="p-8 border-b border-slate-100 flex items-center justify-between bg-indigo-50/30">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg"><i data-lucide="wand-2"></i></div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-800">Paco Assistant</h2>
                        <p class="text-xs font-bold text-indigo-500 uppercase tracking-widest mt-1">Hỗ trợ viết nội dung</p>
                    </div>
                </div>
                <button id="closeAiBtn" class="p-3 hover:bg-white rounded-full transition-all shadow-sm"><i data-lucide="x" class="w-7 h-7"></i></button>
            </div>
            <div id="chatHistory" class="flex-1 overflow-y-auto p-10 space-y-6 custom-scrollbar bg-[#fdfdfd]"></div>
            <div class="p-8 border-t border-slate-100 bg-white">
                <div class="relative max-w-4xl mx-auto flex gap-4">
                    <textarea id="aiPrompt" placeholder="Nhập yêu cầu soạn thảo..." class="flex-1 p-6 rounded-[1.5rem] bg-slate-50 border-2 border-transparent focus:border-indigo-200 outline-none resize-none h-20 transition-all shadow-inner"></textarea>
                    <button id="sendAiBtn" class="p-6 bg-indigo-600 text-white rounded-[1.5rem] shadow-xl hover:bg-indigo-700 transition-all active:scale-90">
                        <i data-lucide="send"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 max-w-7xl mx-auto w-full p-6 md:p-12 grid grid-cols-1 lg:grid-cols-12 gap-12">
        <div class="lg:col-span-8 space-y-10">
            <div class="bg-white rounded-[3rem] shadow-2xl border border-slate-50 overflow-hidden">
                <div class="peaceful-gradient p-10 flex flex-col md:flex-row items-center justify-between gap-10">
                    <div class="text-center md:text-left">
                        <h2 class="text-5xl font-black text-slate-900 leading-tight">Góc nhỏ <br/><span class="text-sky-700 italic font-serif-accent">Bình Yên</span></h2>
                    </div>
                    <div class="bg-white/80 backdrop-blur-lg p-8 rounded-[2.5rem] shadow-xl border border-white flex flex-col gap-6 min-w-[340px]">
                        <div class="space-y-3">
                            <div class="flex justify-between text-[11px] font-black uppercase text-slate-400"><span>Âm lượng</span><span id="volVal" class="text-sky-600">100%</span></div>
                            <input type="range" id="volume" min="0" max="100" value="100" class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-sky-600">
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between text-[11px] font-black uppercase text-slate-400"><span>Tốc độ</span><span id="speedVal" class="text-sky-600">1.0x</span></div>
                            <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-sky-600">
                        </div>
                    </div>
                </div>

                <div class="p-10 space-y-8">
                    <div class="flex flex-wrap items-center justify-between gap-6">
                        <div class="flex bg-slate-100 p-1.5 rounded-[1.2rem] shadow-inner">
                            <button id="tabSingle" class="flex items-center gap-2 px-8 py-3 rounded-xl text-sm font-bold transition-all bg-white shadow-md text-sky-700">Đơn giọng</button>
                            <button id="tabMulti" class="flex items-center gap-2 px-8 py-3 rounded-xl text-sm font-bold transition-all text-slate-500">Đa giọng</button>
                        </div>
                        <select id="voiceSelect" class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-2xl text-[10px] font-black uppercase text-slate-500 outline-none">
                            <!-- Voices injected by JS -->
                        </select>
                    </div>

                    <div id="singleView">
                        <textarea id="textInput" class="w-full h-[400px] p-10 rounded-[2.5rem] bg-slate-50 border-2 border-transparent focus:border-sky-100 focus:bg-white text-slate-800 text-3xl leading-relaxed outline-none shadow-inner transition-all" placeholder="Nhập văn bản..."></textarea>
                    </div>

                    <div id="multiView" class="hidden space-y-6 max-h-[500px] overflow-y-auto pr-4 custom-scrollbar">
                        <div id="multiContainer" class="space-y-6"></div>
                        <button id="addSpeakerBtn" class="w-full py-6 border-2 border-dashed border-slate-200 rounded-[2.5rem] text-slate-400 hover:text-sky-600 transition-all text-sm font-black uppercase tracking-widest">+ Thêm phân đoạn</button>
                    </div>

                    <div class="flex items-center gap-6 pt-10 border-t border-slate-100">
                        <button id="speakBtn" class="flex-1 flex items-center justify-center gap-4 py-6 bg-slate-900 text-white rounded-[2rem] font-black text-2xl shadow-2xl hover:bg-black transition-all">
                            <i data-lucide="play" fill="white" class="w-8 h-8"></i> ĐỌC BÀI VIẾT
                        </button>
                        <button id="stopBtn" class="hidden w-24 h-24 bg-red-50 text-red-600 rounded-[2rem] flex flex-col items-center justify-center transition-all animate-pulse">
                            <i data-lucide="square" fill="currentColor" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-4">
            <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-50 flex flex-col max-h-[600px]">
                <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] mb-8">Nhật ký</h3>
                <div id="historyList" class="flex-1 overflow-y-auto space-y-4 pr-3 custom-scrollbar"></div>
            </div>
        </div>
    </main>

    <script>
        // Tích hợp trực tiếp API Key
        const apiKey = "AIzaSyCfPX92bVcGTkY9Xn7tAS2UA63x7mKLNAw";
        
        const VOICES = ['Charon', 'Kore', 'Zephyr', 'Aoede', 'Puck', 'Fenrir', 'Enceladus'];
        let state = {
            activeTab: 'single',
            history: [],
            multiSpeakers: [{ name: 'Paco', voice: 'Charon', text: '' }]
        };

        const textInput = document.getElementById('textInput');
        let currentAudio = null;

        function init() {
            renderVoiceOptions();
            renderMultiSpeakers();
            lucide.createIcons();
        }

        function renderVoiceOptions() {
            const select = document.getElementById('voiceSelect');
            select.innerHTML = VOICES.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function renderMultiSpeakers() {
            const container = document.getElementById('multiContainer');
            container.innerHTML = state.multiSpeakers.map((s, i) => `
                <div class="bg-slate-50 p-6 rounded-[1.5rem] border border-slate-100 space-y-4">
                    <div class="flex gap-4">
                        <input oninput="state.multiSpeakers[${i}].name=this.value" value="${s.name}" class="p-2 rounded-xl text-xs font-bold w-1/3 outline-none" placeholder="Tên">
                        <select onchange="state.multiSpeakers[${i}].voice=this.value" class="p-2 rounded-xl text-xs font-bold outline-none">
                            ${VOICES.map(v => `<option value="${v}" ${s.voice===v?'selected':''}>${v}</option>`).join('')}
                        </select>
                        <button onclick="removeSpeaker(${i})" class="ml-auto text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <textarea oninput="state.multiSpeakers[${i}].text=this.value" class="w-full h-24 p-4 rounded-xl text-lg outline-none">${s.text}</textarea>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeSpeaker(i) {
            if (state.multiSpeakers.length > 1) {
                state.multiSpeakers.splice(i, 1);
                renderMultiSpeakers();
            }
        }

        document.getElementById('addSpeakerBtn').onclick = () => {
            state.multiSpeakers.push({ name: 'Nhân vật', voice: 'Zephyr', text: '' });
            renderMultiSpeakers();
        };

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length);
            const view = new DataView(buffer);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, pcmData.length, true);
            new Uint8Array(buffer, 44).set(new Uint8Array(pcmData));
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function handleSpeak() {
            const btn = document.getElementById('speakBtn');
            btn.disabled = true;
            btn.innerHTML = "ĐANG XỬ LÝ...";

            try {
                let payload;
                if (state.activeTab === 'single') {
                    payload = {
                        contents: [{ parts: [{ text: textInput.value }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: document.getElementById('voiceSelect').value } } }
                        }
                    };
                } else {
                    const lines = state.multiSpeakers.map(s => `${s.name}: ${s.text}`).join("\n");
                    const configs = state.multiSpeakers.map(s => ({ speaker: s.name, voiceConfig: { prebuiltVoiceConfig: { voiceName: s.voice } } }));
                    payload = {
                        contents: [{ parts: [{ text: lines }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { multiSpeakerVoiceConfig: { speakerVoiceConfigs: configs } }
                        }
                    };
                }

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const audioBase64 = data.candidates[0].content.parts.find(p => p.inlineData)?.inlineData.data;

                if (audioBase64) {
                    const pcm = Uint8Array.from(atob(audioBase64), c => c.charCodeAt(0));
                    const wav = pcmToWav(pcm, 24000);
                    playAudio(wav);
                    addToHistory(wav, state.activeTab === 'single' ? textInput.value : "Hội thoại đa giọng");
                }
            } catch (e) { alert("Lỗi kết nối!"); }
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="play" fill="white" class="w-8 h-8"></i> ĐỌC BÀI VIẾT`;
            lucide.createIcons();
        }

        function playAudio(blob) {
            if (currentAudio) currentAudio.pause();
            currentAudio = new Audio(URL.createObjectURL(blob));
            currentAudio.volume = document.getElementById('volume').value / 100;
            currentAudio.playbackRate = parseFloat(document.getElementById('speed').value);
            currentAudio.play();
            document.getElementById('stopBtn').classList.remove('hidden');
            currentAudio.onended = () => document.getElementById('stopBtn').classList.add('hidden');
        }

        function addToHistory(blob, text) {
            const item = { id: Date.now(), blob, text: text.substring(0, 30) + '...' };
            state.history.unshift(item);
            const list = document.getElementById('historyList');
            list.innerHTML = state.history.map(h => `
                <div class="p-4 bg-slate-50 rounded-xl flex justify-between items-center text-xs font-bold">
                    <span class="truncate w-32">${h.text}</span>
                    <button onclick="downloadBlob(${h.id})" class="text-sky-600"><i data-lucide="download" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.downloadBlob = (id) => {
            const h = state.history.find(x => x.id === id);
            const a = document.createElement('a'); a.href = URL.createObjectURL(h.blob); a.download = 'audio.wav'; a.click();
        };

        document.getElementById('sendAiBtn').onclick = async () => {
            const prompt = document.getElementById('aiPrompt').value;
            if(!prompt) return;

            const history = document.getElementById('chatHistory');
            history.innerHTML += `<div class="p-4 bg-slate-100 rounded-2xl ml-auto max-w-[80%] text-sm mb-4">${prompt}</div>`;
            document.getElementById('aiPrompt').value = '';

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Hãy viết một bài viết ngắn theo yêu cầu sau: " + prompt }] }] })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                history.innerHTML += `<div class="p-4 bg-indigo-50 rounded-2xl mr-auto max-w-[90%] text-sm mb-4 border border-indigo-100">
                    ${text}
                    <button onclick="applyText(\`${text.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)" class="mt-4 block px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs">Dùng bài viết này</button>
                </div>`;
            } catch(e) { alert("Lỗi AI!"); }
        };

        window.applyText = (text) => {
            textInput.value = text;
            document.getElementById('aiModal').classList.add('hidden');
        };

        document.getElementById('tabSingle').onclick = () => { state.activeTab='single'; document.getElementById('singleView').classList.remove('hidden'); document.getElementById('multiView').classList.add('hidden'); };
        document.getElementById('tabMulti').onclick = () => { state.activeTab='multi'; document.getElementById('singleView').classList.add('hidden'); document.getElementById('multiView').classList.remove('hidden'); };
        document.getElementById('openAiBtn').onclick = () => document.getElementById('aiModal').classList.remove('hidden');
        document.getElementById('closeAiBtn').onclick = () => document.getElementById('aiModal').classList.add('hidden');
        document.getElementById('speakBtn').onclick = handleSpeak;
        document.getElementById('stopBtn').onclick = () => { if(currentAudio) currentAudio.pause(); document.getElementById('stopBtn').classList.add('hidden'); };

        init();
    </script>
</body>
</html>
